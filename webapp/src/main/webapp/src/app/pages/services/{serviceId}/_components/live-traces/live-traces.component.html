<div class="live-traces">
  <div class="controls">
    <button class="btn btn-default" (click)="connect()" [disabled]="connected">
      <span class="fa fa-play"></span> Connect
    </button>
    <button class="btn btn-default" (click)="disconnect()" [disabled]="!connected">
      <span class="fa fa-stop"></span> Disconnect
    </button>
    <button class="btn btn-default" (click)="clear()" [disabled]="spans.length === 0">
      <span class="fa fa-trash"></span> Clear
    </button>
    <span class="status" [class.text-success]="connected" [class.text-muted]="!connected">
      {{ connected ? 'Connected' : 'Disconnected' }}
    </span>
    <span class="count" *ngIf="totalEvents"> | {{ totalEvents }} event(s)</span>
    <span class="text-danger" *ngIf="error"> | {{ error }}</span>
  </div>

  <app-trace-group-list [traceGroups]="traceGroups" />
</div>
