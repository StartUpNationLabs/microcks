services:
  mongo:
    image: mongo:4.4.29
    container_name: microcks-db
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 1s
      retries: 3
    ports:
      -  "27017:27017"
  keycloak:
     image: quay.io/keycloak/keycloak:26.0.0
     container_name: microcks-sso
     ports:
        - "18080:8080"
     environment:
        KEYCLOAK_ADMIN: "admin"
        KEYCLOAK_ADMIN_PASSWORD: "admin"
     volumes:
        - "./keycloak-realm/microcks-realm-sample.json:/opt/keycloak/data/import/microcks-realm.json"
     command: ["start-dev", "--hostname=http://localhost:18080", "--import-realm", "--health-enabled=true"]
     healthcheck:
        test: ["CMD", "sh", "-c", "echo -e 'GET /health/live HTTP/1.1\r\nHost: localhost\r\n\r\n' > /dev/tcp/localhost/9000"]
        start_period: 10s
        interval: 10s
        timeout: 2s
        retries: 3
  postman:
    image: quay.io/microcks/microcks-postman-runtime:0.6.0
    container_name: microcks-postman-runtime
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      start_period: 5s
      interval: 20s
      timeout: 3s
      retries: 3

  kafka:
    image: redpandadata/redpanda:v24.3.1
    container_name: microcks-kafka
    command: [
      "redpanda", "start",
      "--overprovisioned --smp 1 --memory 1G --reserve-memory 0M --node-id 0 --check=false",
      "--kafka-addr PLAINTEXT://0.0.0.0:19092,EXTERNAL://0.0.0.0:9092",
      "--advertise-kafka-addr PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092"
    ]
    ports:
      - "9092:9092"
      - "19092:19092"
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c 'echo > /dev/tcp/localhost/19092'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  app:
    depends_on:
      - mongo
      - postman
    image: ghcr.io/startupnationlabs/microcks/microcks-uber:add-caching
#    image: quay.io/microcks/microcks-uber:nightly
    container_name: microcks
    volumes:
      - "./config:/deployments/config"
    ports:
      - "8080:8080"
      - "9090:9090"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATA_MONGODB_URI=mongodb://mongo:27017
      - SPRING_DATA_MONGODB_DATABASE=microcks
      - POSTMAN_RUNNER_URL=http://postman:3000
      - TEST_CALLBACK_URL=http://microcks:8080
      - SERVICES_UPDATE_INTERVAL=0 0 0/2 * * *
      #- MAX_UPLOAD_FILE_SIZE=3MB
      - ASYNC_MINION_URL=http://microcks-async-minion:8081
      - KAFKA_BOOTSTRAP_SERVER=kafka:19092
      - KEYCLOAK_ENABLED=false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      start_period: 35s
      interval: 10s
      timeout: 3s
      retries: 3

  async-minion:
    depends_on:
      - app
    ports:
      - "8081:8081"
    image: quay.io/microcks/microcks-async-minion:nightly
    container_name: microcks-async-minion
    restart: on-failure
    volumes:
      - "./config:/deployments/config"
    environment:
      - QUARKUS_PROFILE=docker-compose
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/q/health/ready"]
      start_period: 10s
      interval: 10s
      timeout: 2s
      retries: 3

  prometheus:
     image: prom/prometheus:latest
     container_name: prometheus
     volumes:
        - "./prometheus.yaml:/etc/prometheus/prometheus.yaml"
     ports:
        - "9091:9090"
     command:
        - "--config.file=/etc/prometheus/prometheus.yaml"
        - "--storage.tsdb.path=/prometheus"
        - "--web.enable-lifecycle"
        - "--web.enable-remote-write-receiver"

  grafana:
     image: grafana/grafana:latest
     container_name: grafana
     ports:
        - "3000:3000"
     environment:
        - GF_SECURITY_ADMIN_USER=admin
        - GF_SECURITY_ADMIN_PASSWORD=admin
     volumes:
        - "~/.grafana:/var/lib/grafana"
        - "./grafana-provisioning:/etc/grafana/provisioning"

  cadvisor:
     image: gcr.io/cadvisor/cadvisor:latest
     restart: unless-stopped
     devices:
        - "/dev/kmsg:/dev/kmsg"
     volumes:
        - /:/rootfs:ro
        - /var/run:/var/run:rw
        - /var/run/docker.sock:/var/run/docker.sock:rw
        - /sys:/sys:ro
        - /var/lib/docker/:/var/lib/docker:ro
        - /dev/disk/:/dev/disk:ro
     expose:
        - 8080
     ports:
        - 8085:8080

